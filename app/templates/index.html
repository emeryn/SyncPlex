<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }}</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="/static/css/app.css?v={{ version }}" rel="stylesheet">
</head>
<body>
    <div class="app">
        <aside id="sidebar" class="sidebar">
            <a href="#/servers" class="brand">
                <img src="/static/logo.png" alt="">
                <span class="brand-text"><span class="c-blue">SYNC</span><span class="c-plex">PLEX</span></span>
            </a>
            <nav class="nav">
                <a href="#/servers" data-nav="servers" class="nav-item" title="Servers"><i class="fa-solid fa-server"></i><span>Servers</span></a>
                <a href="#/recent" data-nav="recent" class="nav-item" title="Recently Added"><i class="fa-solid fa-clock-rotate-left"></i><span>Recently Added</span></a>
                <a href="#/search" data-nav="search" class="nav-item" title="Search"><i class="fa-solid fa-magnifying-glass"></i><span>Search</span></a>
                <a href="#/downloads" data-nav="downloads" class="nav-item" title="Sync Queue">
                    <i class="fa-solid fa-cloud-arrow-down"></i><span>Sync Queue</span>
                    <b id="queue-badge" class="nav-badge" hidden></b>
                </a>
                <a href="#/files" data-nav="files" class="nav-item" title="Files &amp; Storage"><i class="fa-solid fa-hard-drive"></i><span>Files &amp; Storage</span></a>
            </nav>
            <div class="sidebar-footer">
                <div class="storage">
                    <div class="storage-row"><span>Storage</span><span id="storage-text">…</span></div>
                    <div id="storage-bar" class="progress"><div></div></div>
                </div>
                <div class="user">
                    <span id="user-avatar" class="avatar avatar-sm"></span>
                    <span id="user-name" class="user-name truncate"></span>
                    <button class="btn-icon" data-action="logout" title="Sign out"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
                <button class="btn-icon collapse-btn" data-action="toggle-sidebar" title="Collapse sidebar"><i class="fa-solid fa-angles-left"></i></button>
            </div>
        </aside>
        <div id="backdrop" class="backdrop" data-action="toggle-menu" hidden></div>

        <main id="main" class="main">
            <header class="topbar">
                <button class="btn-icon menu-btn" data-action="toggle-menu" title="Menu"><i class="fa-solid fa-bars"></i></button>
                <button id="back-btn" class="btn-icon" data-action="back" title="Back" hidden><i class="fa-solid fa-arrow-left"></i></button>
                <h1 id="page-title" class="page-title"></h1>
                <div id="toolbar" class="toolbar"></div>
            </header>
            <section id="view" class="view"></section>
        </main>
    </div>

    <button id="fab" class="sync-fab" data-action="sync-selected">
        <i class="fa-solid fa-cloud-arrow-down"></i><span>Sync to server</span><span id="fab-count" class="fab-count">0</span>
    </button>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <!-- Item details -->
    <div id="info-modal" class="modal" data-action="close-modal" hidden>
        <div class="modal-box detail" data-stop>
            <button class="btn-icon modal-close" data-action="close-modal" title="Close"><i class="fa-solid fa-xmark"></i></button>
            <div class="detail-poster"><img id="info-poster" src="" alt=""></div>
            <div id="info-body" class="detail-body"></div>
        </div>
    </div>

    <!-- Connection picker -->
    <div id="conn-modal" class="modal" data-action="close-modal" hidden>
        <div class="modal-box modal-md" data-stop>
            <button class="btn-icon modal-close" data-action="close-modal" title="Close"><i class="fa-solid fa-xmark"></i></button>
            <h3>Server connection</h3>
            <p class="small muted">Pin an address if the automatic choice is slow (relay speed caps) or unreachable.</p>
            <div id="conn-list" class="conn-list"></div>
        </div>
    </div>

    <!-- Confirmation -->
    <div id="confirm-modal" class="modal" data-action="close-modal" hidden>
        <div class="modal-box modal-sm" data-stop>
            <div class="confirm-icon"><i class="fa-solid fa-trash-can"></i></div>
            <h3 id="confirm-title"></h3>
            <p id="confirm-msg" class="muted" style="margin-top: 8px"></p>
            <div class="confirm-actions">
                <button class="btn" data-action="close-modal">Cancel</button>
                <button id="confirm-yes" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js?v={{ version }}"></script>
</body>
</html>
